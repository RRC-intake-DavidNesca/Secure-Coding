{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>Debug information</h2>
    <ul>
        <li><strong>Secret key:</strong> {{ details['secret_key'] }}</li>

        <li><strong>Session:</strong> {{ details['session'] }}</li>
    </ul>
</div>
{% endblock %}
